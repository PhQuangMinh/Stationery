<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>WebSocket Notification Test</title>
  <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
</head>
<body>
  <h1>📬 Notification WebSocket Test</h1>

  <form id="notificationForm" onsubmit="sendMessage(); return false;">
    <label>Message: <input type="text" id="message" required></label><br>
    <label>Status: <input type="text" id="status"></label><br>
    <label>Link: <input type="text" id="link"></label><br>
    <label>Type: <input type="text" id="type"></label><br>
    <label>Receiver Username: <input type="text" id="usernameReceiver" required></label><br>
    <button type="submit">Send Notification</button>
  </form>

  <div id="messages" style="margin-top: 20px;"></div>

  <script>
    let stompClient = null;
    let usernameReceiverGlobal = null;

    function connect() {
      const socket = new SockJS("http://localhost:8080/websocket");
      stompClient = Stomp.over(socket);

      stompClient.connect({}, function (frame) {
        console.log("Connected: " + frame);
        document.getElementById("messages").innerHTML += "<p>🔌 Connected</p>";

        if (usernameReceiverGlobal) {
          stompClient.subscribe(
            `/topic/notifications/${usernameReceiverGlobal}`,
            function (message) {
              const body = JSON.parse(message.body);
              document.getElementById("messages").innerHTML += `<p>📥 From server: ${body.message}</p>`;
            }
          );
        }
      });
    }

    function sendMessage() {
      const message = document.getElementById("message").value;
      const status = document.getElementById("status").value;
      const link = document.getElementById("link").value;
      const type = document.getElementById("type").value;
      const usernameReceiver = document.getElementById("usernameReceiver").value;

      usernameReceiverGlobal = usernameReceiver;

      if (!stompClient || !stompClient.connected) {
        connect(); // Connect nếu chưa kết nối
        setTimeout(sendMessage, 1000); // Đợi kết nối xong rồi gửi
        return;
      }

      const payload = {
        message,
        status,
        link,
        type,
        usernameReceiver
      };

      stompClient.send("/app/send", {}, JSON.stringify(payload));

      document.getElementById("messages").innerHTML += `<p>📤 Sent to ${usernameReceiver}: ${message}</p>`;
    }

    // Auto connect nếu muốn
    // connect();
  </script>
</body>
</html>
