<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hiệu sách cô Minh</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }
        nav ul {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            background-color: #f8f9fa;
        }
        nav ul li {
            position: relative;
            padding: 10px 20px;
            cursor: pointer;
        }
        nav ul li a {
            text-decoration: none;
            color: #333;
        }
        .submenu {
            display: none;
            position: absolute;
            left: 0;
            top: 100%;
            background-color: white;
            min-width: 200px;
            box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.1);
        }
        .submenu li {
            padding: 10px;
            width: 100%;
        }
        .submenu li:hover {
            background-color: #f1f1f1;
        }
        nav ul li:hover > .submenu {
            display: block;
        }
        .submenu .submenu {
            left: 100%;
            top: 0;
        }
    </style>
</head>
<body>
    <header>
        
    </header>
    <script>
        const categories = [
            {
                name: "Sách giáo khoa",
                subcategories: [
                    {
                        name: "Lớp 1",
                        subcategories: [
                            { name: "Cánh diều", subcategories: [] },
                            { name: "Kết nối tri thức", subcategories: [] },
                            { name: "Chân trời sáng tạo", subcategories: [] }
                        ]
                    },
                    { name: "Lớp 2", subcategories: [] },
                    { name: "Lớp 3", subcategories: [] }
                ]
            },
            { name: "Sách tham khảo", subcategories: [] },
            { name: "Vở ghi", subcategories: [] },
            { name: "Máy tính cầm tay", subcategories: [] },
            { name: "Đồ dùng học tập", subcategories: [] },
            { name: "Khác", subcategories: [] }
        ];

        document.addEventListener("DOMContentLoaded", function () {
            const menuContainer = document.getElementById("menu");

            function createMenuItems(categories) {
                const ul = document.createElement("ul");
                ul.classList.add("submenu");

                categories.forEach(category => {
                    const li = document.createElement("li");
                    li.textContent = category.name;

                    if (category.subcategories.length > 0) {
                        const subMenu = createMenuItems(category.subcategories);
                        li.appendChild(subMenu);
                    }

                    ul.appendChild(li);
                });

                return ul;
            }

            categories.forEach(category => {
                const li = document.createElement("li");
                li.innerHTML = `<a href="#">${category.name}</a>`;

                if (category.subcategories.length > 0) {
                    const subMenu = createMenuItems(category.subcategories);
                    li.appendChild(subMenu);
                }

                menuContainer.appendChild(li);
            });
        });
    </script>
</body>
</html>
