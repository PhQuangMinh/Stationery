<!DOCTYPE html>
<html lang="vi">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>checkout page</title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
        <link rel="stylesheet" href="../../static/css/order/detailorder.css">
        <link rel="stylesheet" href="../../../static/css/component/header.css">
        <link rel="stylesheet" href="../../../static/css/component/footer.css">
        <link rel="shortcut icon" href="#">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css">
    </head>
    <body>
        <div id="header-container"></div>
        <div class="container">
            <a href="../../landingpage/landingpage.html" class=" text-dark text-decoration-none">Trang chủ</a>
            <p class="text-dark text-decoration-none" style="display: inline;"> / Chi tiết đơn hàng</p>
            <hr>
        </div>
        <div class="container py-5">
            <h1 class="mb-4">Đơn hàng của bạn</h1>
            
            <!-- Thêm phần thông tin đơn hàng -->
            <div class="order-info mb-4">
                <div class="row">
                    <div class="col-md-6">
                        <p><strong>Mã đơn hàng:</strong> <span id="orderId"></span></p>
                        <p><strong>Ngày đặt:</strong> <span id="orderDate"></span></p>
                        <p><strong>Trạng thái:</strong> <span id="orderStatus"></span></p>
                    </div>
                    <div class="col-md-6">
                        <p><strong>Địa chỉ giao hàng:</strong> <span id="shippingAddress"></span></p>
                        <p><strong>Phương thức thanh toán:</strong> <span id="paymentMethod"></span></p>
                    </div>
                </div>
            </div>

            <div class="table-responsive">
                <table class="table table-bordered">
                    <thead>
                        <tr>
                            <th>Ảnh sản phẩm</th>
                            <th>Tên sản phẩm</th> 
                            <th>Đơn giá</th>
                            <th>Số lượng</th>
                            <th>Thành tiền</th>
                        </tr>
                    </thead>
                    <tbody id="productList">
                        <!-- Sản phẩm sẽ được thêm vào đây bằng JavaScript -->
                    </tbody>
                </table>
            </div>
    
            <div class="text-end mt-4">
                <h5>
                    Tổng tiền thanh toán: 
                    <span class="text-danger ms-2" id="totalAmount">0 đ</span>
                </h5>
            </div>
        </div>
        <div id="footer-container"></div>
        <div class="modal fade" id="reviewModal" tabindex="-1">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">Đánh giá sản phẩm</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <div class="product-info mb-3">
                            <img id="modalProductImage" src="" alt="" class="img-fluid mb-2" style="max-width: 100px;">
                            <h6 id="modalProductName"></h6>
                        </div>
                        <div class="rating-input mb-3">
                            <label>Đánh giá của bạn:</label>
                            <div class="stars">
                                <i class="bi bi-star" data-rating="1"></i>
                                <i class="bi bi-star" data-rating="2"></i>
                                <i class="bi bi-star" data-rating="3"></i>
                                <i class="bi bi-star" data-rating="4"></i>
                                <i class="bi bi-star" data-rating="5"></i>
                            </div>
                        </div>
                        <div class="form-group">
                            <label>Nhận xét:</label>
                            <textarea class="form-control" id="reviewComment" rows="3"></textarea>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Đóng</button>
                        <button type="button" class="btn btn-primary" id="submitReview">Gửi đánh giá</button>
                    </div>
                </div>
            </div>
        </div>
        <script src="../../../static/js/component.js"></script>
        <script src="../../static/js/order/detailorder.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.min.js"></script>
    </body>

</html>
