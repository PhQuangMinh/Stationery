<!DOCTYPE html>
<html lang="vi">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Giỏ hàng của bạn</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
        <link rel="stylesheet" href="../../static/css/payment/shoppingcart.css">
    </head>
    <body>
        <div id="header-container"></div>
        <div class="container">
            <a href="../landingpage/landingpage.html" class=" text-dark text-decoration-none">Trang chủ</a>
            <p class="text-dark text-decoration-none" style="display: inline;"> / Giỏ hàng</p>
            <hr>
        </div>
        <div class="container">
            <table class="table table-striped table-hover table-bordered " style="text-align: center;">
                <thead>
                    <tr>
                        <th>Ảnh sản phẩm</th>
                        <th>Tên sản phẩm</th>
                        <th>Đơn giá</th>
                        <th>Số lượng</th>
                        <th>Thành tiền</th>
                        <th>Xóa</th>
                    </tr>
                </thead>
                <tbody id="cart-body">
                </tbody>
            </table>
        </div>
        <div class="container">
            <div class="row justify-content-end">
                <div class="col-8"></div>
                <div class="col-4">
                    <table class="table table-bordered">
                        <tbody>
                            <tr>
                                <td><strong>Tạm tính:</strong></td>
                                <td id="subtotal">0 đ</td>
                            </tr>
                            <tr>
                                <td><strong>Tổng số tiền:</strong></td>
                                <td id="total">0 đ</td>
                            </tr>
                        </tbody>
                    </table>
                    <div class="text-center">
                        <button id="checkout-btn" class="btn btn-danger btn-lg">Tiến hành thanh toán</button>
                    </div>
                </div>
            </div>
        </div>
        <div id="footer-container"></div>
        <script src="../../static/js/shoppingcart.js"></script>
        <script src="../../static/js/component.js"></script>
    </body>
</html>
