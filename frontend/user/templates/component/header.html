<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hiệu sách cô Minh </title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="../../static/css/component/header.css">
</head>
<body>
    <header>
        <div class="top-bar">
            <a id="home-link">Trang chủ</a>
            <p>Chào mừng bạn đến Website | Email: example@gmail.com</p>
            <div class="user-options">
                <a id="register-link">Đăng ký</a> | 
                <a id="login-link">Đăng nhập</a>
            </div>
        </div>
        <div class="container">
            <div class="main-header">
                <div class="col-lg-2">
                    <img src="../../static/img/logo.png" alt="VP Logo" class="logo">
                </div>
                <div class="col-lg-7">
                    <div class="search-bar d-flex">
                        <input type="text" class="form-control me-2" placeholder="Tìm kiếm sản phẩm...">
                        <button class="btn btn-primary">🔍</button>
                    </div>
                </div>
                <div class="col-lg-3">
                    <div class="d-flex justify-content-between align-items-center">
                        <div class="contact">
                            <p class="mb-0">📞 Gọi đặt hàng</p>
                            <strong>06677028</strong>
                        </div>
                        <div class="cart">
                            <a id="cart-link" class="text-danger text-decoration-none" target="_self">🛒 Giỏ hàng (0 sản phẩm)</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <nav>
            <ul id="menu"></ul>
        </nav>
    </header>
    <script src="../../static/js/component.js"></script>
</body>
</html>
