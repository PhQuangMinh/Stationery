    <link rel="stylesheet" href="../../static/css/component/footer.css">

<body>
    <footer class="footer">
        <div class="container">
            <div class="row align-items-center">
                <!-- Company Info -->
                <div class="col-md-4 mb-4 mb-md-0">
                    <img src="../../static/img/logo.png" alt="CooVinh Logo" class="company-logo">
                    <div class="contact-info">
                        <p class="mb-1"><strong>Địa chỉ:</strong> Diên phong, Diên Châu, Nghệ An</p>
                        <p class="mb-1"><strong>Điện thoại:</strong> 1234567890</p>
                        <p class="mb-1"><strong>Email:</strong> phamquangminh15012004@gmail.com</p>
                    </div>
                </div>

                <!-- Hotline -->
                <div class="col-md-4 mb-4 mb-md-0">
                    <div class="hotline-section">
                        <h3>Hotline liên hệ</h3>
                        <div class="hotline-icon">
                            <i class="fas fa-phone-alt fa-2x mb-2"></i>
                        </div>
                        <div class="hotline-number">12345678901</div>
                        <div class="hotline-hours">07h00 - 21h00 (T2-CN)</div>

                    <div class="social-links">
                        <h3>Kết nối với chúng tôi</h3>
                        <div class="social-icons">
                            <a href="../../static/img/logo/logo-facebook.png" target="_blank" aria-label="Facebook">

                            </a>
                            <a href="../../static/img/logo/logo-instagram.png" target="_blank" aria-label="Instagram">
