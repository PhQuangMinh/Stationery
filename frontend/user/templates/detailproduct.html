<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sách Khoa học tự nhiên 9</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="../static/css/detailproduct.css">
</head>
<body>
    <div id="header-container"></div>
    <div class="container">
        <a href="landingpage/landingpage.html" class=" text-dark text-decoration-none">Trang chủ</a>
        <p class="text-dark text-decoration-none" style="display: inline;"> / Chi tiết sản phẩm</p>
        <hr>
    </div>
    <div class="container my-5">
        <!-- Product Section -->
        <div class="row">
            <!-- Product Image -->
            <div class="col-md-6">
                <img id="product-image" src="" alt="" class="product-image img-fluid">
            </div>
            
            <!-- Product Details -->
            <div class="col-md-6" id="product-details">
                <!-- Product details will be rendered here -->
            </div>
        </div>

        <!-- Reviews Section -->
        <div class="review-section">
            <h3 class="mb-4">Đánh giá từ khách hàng</h3>
            <div id="reviews-container">
                <!-- Reviews will be rendered here -->
            </div>
            <nav aria-label="Reviews pagination">
                <ul class="pagination" id="pagination">
                    <!-- Pagination will be rendered here -->
                </ul>
            </nav>
        </div>
    </div>

    <div id="footer-container"></div>

    <script src="../static/js/component.js"></script>
    <script src="../static/js/detailproduct.js"></script>
</body>
</html>
