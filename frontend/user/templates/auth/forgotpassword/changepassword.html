<!DOCTYPE html>
<html lang="vi">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>checkout page</title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
        <link rel="stylesheet" href="../../../static/css/auth/forgotpassword/changepassword.css">
        <link rel="stylesheet" href="../../../static/css/component/header.css">
        <link rel="stylesheet" href="../../../static/css/component/footer.css">
        <link rel="shortcut icon" href="#">
    </head>
    <body>
        <div id="header-container"></div>
        <div class="container">
            <a href="../../landingpage/landingpage.html" class=" text-dark text-decoration-none">Trang chủ</a>
            <p class="text-dark text-decoration-none" style="display: inline;"> / Quên mật khẩu</p>
            <hr>
        </div>
        <div class="container">
            <div class="form-container">
                <h1 class="change-title">Đổi mật khẩu</h1>
    
                <form id="changePasswordForm" novalidate>
                    <div class="mb-3">
                        <label for="currentPassword" class="form-label">Mật khẩu cũ</label>
                        <input type="password" 
                               class="form-control" 
                               id="currentPassword"
                               required>
                        <div class="invalid-feedback">
                            Vui lòng nhập mật khẩu hiện tại
                        </div>
                    </div>
    
                    <div class="mb-3">
                        <label for="newPassword" class="form-label">Mật khẩu</label>
                        <input type="password" 
                               class="form-control" 
                               id="newPassword"
                               required
                               minlength="8">
                        <div class="invalid-feedback">
                            Mật khẩu phải có ít nhất 8 ký tự
                        </div>
                        <div class="password-strength" id="passwordStrength"></div>
                    </div>
    
                    <div class="mb-4">
                        <label for="confirmPassword" class="form-label">Xác nhận mật khẩu</label>
                        <input type="password" 
                               class="form-control" 
                               id="confirmPassword"
                               required>
                        <div class="invalid-feedback">
                            Mật khẩu xác nhận không khớp
                        </div>
                    </div>
    
                    <div>
                        <button type="submit" class="btn btn-primary btn-confirm" id="submitButton">
                            Xác nhận
                        </button>
                    </div>
                </form>
            </div>
        </div>
        <div id="footer-container"></div>
        <script src="../../../static/js/component.js"></script>
        <script src="../../../static/js/auth/forgotpassword/changepassword.js"></script>
    </body>

</html>
