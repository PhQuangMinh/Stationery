<!DOCTYPE html>
<html lang="vi">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>checkout page</title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
        <link rel="stylesheet" href="../../../static/css/auth/forgotpassword/maidsender.css">
        <link rel="stylesheet" href="../../../static/css/component/header.css">
        <link rel="stylesheet" href="../../../static/css/component/footer.css">
        <link rel="shortcut icon" href="#">
    </head>
    <body>
        <div id="header-container"></div>
        <div class="container">
            <a href="../../landingpage/landingpage.html" class=" text-dark text-decoration-none">Trang chủ</a>
            <p class="text-dark text-decoration-none" style="display: inline;"> / Quên mật khẩu</p>
            <hr>
        </div>
        <div class="container">
            <div class="form-container">
                <h1 class="forgot-title">Quên mật khẩu</h1>
                <p class="instruction-text">
                    Vui lòng nhập email, mã OTP sẽ được gửi đến email của bạn.
                </p>
    
                <form id="forgotPasswordForm" novalidate>
                    <div class="mb-4">
                        <label for="email" class="form-label">
                            Email<span class="required">*</span>
                        </label>
                        <input type="email" class="form-control" id="email" required>
                        <div class="invalid-feedback">
                            Vui lòng nhập email hợp lệ
                        </div>
                    </div>
    
                    <div>
                        <button type="submit" class="btn btn-primary btn-otp" id="submitButton">
                            Gửi mã OTP
                        </button>
                    </div>
                </form>
            </div>
        </div>
        <div id="footer-container"></div>
        <script src="../../../static/js/component.js"></script>
        <script src="../../../static/js/auth/forgotpassword/mailsender.js"></script>
    </body>

</html>
