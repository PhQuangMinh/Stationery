<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký tài khoản</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../../static/css/auth/signup.css">
    <style>
        
    </style>
</head>
<body>
    <div id="header-container"></div>
    <div class="container">
        <a href="../landingpage/landingpage.html" class=" text-dark text-decoration-none">Trang chủ</a>
        <p class="text-dark text-decoration-none" style="display: inline;"> / Đăng ký</p>
        <hr>
    </div>
    <div class="container">
        <div class="form-container">
            <h1 class="register-title">Đăng ký tài khoản</h1>
            <p class="login-text">
                Nếu có tài khoản, xin vui lòng <a href="#">đăng nhập</a>
            </p>

            <form id="registerForm" novalidate>
                <div class="mb-3">
                    <label for="firstName" class="form-label">
                        Tên<span class="required">*</span>
                    </label>
                    <input type="text" class="form-control" id="firstName" required>
                    <div class="invalid-feedback">
                        Vui lòng nhập tên
                    </div>
                </div>

                <div class="mb-3">
                    <label for="lastName" class="form-label">
                        Họ và tên đệm<span class="required">*</span>
                    </label>
                    <input type="text" class="form-control" id="lastName" required>
                    <div class="invalid-feedback">
                        Vui lòng nhập họ và tên đệm
                    </div>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label">
                        Email<span class="required">*</span>
                    </label>
                    <input type="email" class="form-control" id="email" required>
                    <div class="invalid-feedback">
                        Vui lòng nhập email hợp lệ
                    </div>
                </div>

                <div class="mb-4">
                    <label for="password" class="form-label">
                        Mật khẩu<span class="required">*</span>
                    </label>
                    <input type="password" class="form-control" id="password" required>
                    <div class="invalid-feedback">
                        Vui lòng nhập mật khẩu
                    </div>
                </div>

                <div>
                    <button type="submit" class="btn btn-primary btn-register">Đăng ký</button>
                </div>
            </form>
        </div>
    </div>

    <div id="footer-container"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../static/js/auth/signup.js"></script>
    <script src="../../static/js/component.js"></script>

</body>
</html>
