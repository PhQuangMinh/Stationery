<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý người dùng</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../static/css/user.css">
    <link rel="stylesheet" href="../static/css/sidebar.css">
</head>
<body>

    <div id="sidebar-container"></div>

    <div class="main-content">
        <div class="bg-white rounded shadow-sm p-4">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h1 class="h5 mb-0">Danh sách người dùng</h1>
                <div>
                    <button id="btnAddUser" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addUserModal">Thêm mới</button>
                    <button class="btn btn-success ms-2" id="saveUserChanges">Lưu</button>
                </div>
            </div>

            <div class="table-container">
                <table class="table">
                    <thead>
                        <tr>
                            <th>Tên</th>
                            <th>Email</th>
                            <th>Username</th>
                            <th>Địa chỉ</th>
                            <th>Số điện thoại</th>
                        </tr>
                    </thead>
                    <tbody id="userTableBody">
                        <!-- Dữ liệu sẽ được thêm từ JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Modal Thêm Người Dùng -->
    <div class="modal fade" id="addUserModal" tabindex="-1" aria-labelledby="addUserModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="addUserModalLabel">Thêm người dùng mới</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <label>Tên:</label>
                    <input type="text" id="newUserName" class="form-control">

                    <label>Email:</label>
                    <input type="email" id="newUserEmail" class="form-control">

                    <label>Username:</label>
                    <input type="text" id="newUserUsername" class="form-control">

                    <label>Địa chỉ:</label>
                    <input type="text" id="newUserAddress" class="form-control">

                    <label>Số điện thoại:</label>
                    <input type="text" id="newUserPhone" class="form-control">
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
                    <button type="button" class="btn btn-success" id="btnSaveUser">Lưu</button>
                </div>
            </div>
        </div>
    </div>

    <!-- JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../static/js/user.js"></script>
    <script src="../static/js/sidebar.js"></script>

</body>
</html>
