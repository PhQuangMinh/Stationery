<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý người dùng</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../static/css/user.css">
    <link rel="stylesheet" href="../static/css/sidebar.css">
</head>
<body>

    <div id="sidebar-container"></div>

    <div class="main-content">
        <div class="bg-white rounded shadow-sm p-4">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h1 class="h5 mb-0">Danh sách người dùng</h1>
                <div>
                    <button id="btnAddUser" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addUserModal">Thêm mới</button>
                </div>
            </div>

            <div class="table-container">
                <table class="table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Họ</th>
                            <th>Tên</th>
                            <th>Username</th>
                            <th>Email</th>
                            <th>Địa chỉ</th>
                            <th>Số điện thoại</th>
                            <th>Vai trò</th>
                        </tr>
                    </thead>
                    <tbody id="userTableBody">
                        <!-- Dữ liệu sẽ được thêm từ JavaScript -->
                    </tbody>
                </table>
            </div>

            <!-- Thêm phân trang -->
            <div class="d-flex justify-content-center mt-4">
                <nav aria-label="Page navigation">
                    <ul class="pagination" id="pagination">
                        <li class="page-item">
                            <button class="page-link" id="prevPage" aria-label="Previous">
                                <span aria-hidden="true">&laquo;</span>
                            </button>
                        </li>
                        <!-- Các số trang sẽ được thêm vào đây -->
                        <li class="page-item">
                            <button class="page-link" id="nextPage" aria-label="Next">
                                <span aria-hidden="true">&raquo;</span>
                            </button>
                        </li>
                    </ul>
                </nav>
            </div>
        </div>
    </div>

    <!-- Modal Thêm/Sửa Người Dùng -->
    <div class="modal fade" id="addUserModal" tabindex="-1" aria-labelledby="userModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="userModalLabel">Thêm người dùng mới</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">Họ:</label>
                            <input type="text" id="userFirstName" class="form-control" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Tên:</label>
                            <input type="text" id="userLastName" class="form-control" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Email:</label>
                            <input type="email" id="userEmail" class="form-control" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Username:</label>
                            <input type="text" id="userUsername" class="form-control" required>
                        </div>
                        <div class="col-12" id="passwordField">
                            <label class="form-label">Mật khẩu:</label>
                            <input type="password" id="userPassword" class="form-control" required>
                        </div>
                        <div class="col-12" id="confirmPasswordField">
                            <label class="form-label">Xác nhận mật khẩu:</label>
                            <input type="password" id="userConfirmPassword" class="form-control" required>
                        </div>
                        <div class="col-12">
                            <label class="form-label">Địa chỉ:</label>
                            <input type="text" id="userAddress" class="form-control" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Số điện thoại:</label>
                            <input type="text" id="userPhone" class="form-control" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Vai trò:</label>
                            <select id="userRole" class="form-select" required>
                                <option value="ROLE_USER">Người dùng</option>
                                <option value="ROLE_ADMIN">Quản trị viên</option>
                            </select>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
                    <button type="button" class="btn btn-success" id="btnSaveUser">Lưu</button>
                </div>
            </div>
        </div>
    </div>

    <!-- JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../static/js/user.js"></script>
    <script src="../static/js/sidebar.js"></script>

</body>
</html>
