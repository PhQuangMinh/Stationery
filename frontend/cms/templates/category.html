<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý danh mục</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../static/css/category.css">
    <link rel="stylesheet" href="../static/css/sidebar.css">
    <style>
        .category-item {
            padding: 0.5rem;
            border-radius: 4px;
            margin: 0.25rem 0;
            cursor: pointer;
        }
        .category-item:hover {
            background-color: #f8f9fa;
        }
    </style>
</head>
<body>
    <div id="sidebar-container"></div>
    
    <div class="main-content">
        <div class="bg-white rounded shadow-sm p-4">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h1 class="h5 mb-0">Danh mục</h1>
                <button class="btn btn-success" id="btnShowAddCategory">
                    <i class="bi bi-plus-circle"></i> Thêm danh mục
                </button>
            </div>

            <div class="mt-4">
                <h5>Danh sách danh mục</h5>
                <div id="categoryList"></div>
            </div>
        </div>
    </div>

    <!-- Modal Quản lý danh mục -->
    <div class="modal fade" id="categoryModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalTitle">Thêm danh mục mới</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="categoryId">
                    <div class="mb-3">
                        <label for="categoryName" class="form-label">Tên danh mục</label>
                        <input type="text" class="form-control" id="categoryName">
                    </div>
                    <div class="mb-3">
                        <label for="parentCategory" class="form-label">Danh mục cha</label>
                        <select class="form-select" id="parentCategory">
                            <option value="">Không có danh mục cha</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label d-block">Trạng thái</label>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="status" id="statusActive" value="false" checked>
                            <label class="form-check-label" for="statusActive">Hoạt động</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="status" id="statusInactive" value="true">
                            <label class="form-check-label" for="statusInactive">Không hoạt động</label>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Đóng</button>
                    <button type="button" class="btn btn-danger" id="btnDeleteCategory" style="display: none;">Xóa</button>
                    <button type="button" class="btn btn-primary" id="btnSaveCategory">Lưu</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../static/js/sidebar.js"></script>
    <script src="../static/js/category.js"></script>
</body>
</html>
