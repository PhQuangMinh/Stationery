<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý danh mục</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../static/css/category.css">
    <link rel="stylesheet" href="../static/css/sidebar.css">
</head>
<body>
    <div id="sidebar-container"></div>
    
    <div class="main-content">
        <div class="bg-white rounded shadow-sm p-4">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h1 class="h5 mb-0">Danh mục</h1>
            </div>
            <hr>
            <div class="mt-4">
                <div id="categoryList"></div>
            </div>

            <!-- Form thêm danh mục con -->
            <div id="addSubcategoryContainer" style="display: none;" class="mt-3">
                <h5>Thêm danh mục con vào: <span id="selectedCategoryName"></span></h5>
                <input type="text" id="subcategoryInput" class="form-control mt-2" placeholder="Nhập tên danh mục con">
                <button id="btnAddSubcategory" class="btn btn-primary mt-2">Thêm danh mục con</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../static/js/sidebar.js"></script>
    <script src="../static/js/category.js"></script>
</body>
</html>
