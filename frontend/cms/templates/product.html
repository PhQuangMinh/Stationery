<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý sản phẩm</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../static/css/product.css">
    <link rel="stylesheet" href="../static/css/sidebar.css">
    <style>
        .product-image {
            max-width: 100px;
            max-height: 100px;
            object-fit: contain;
        }
        .btn-action {
            margin: 0 2px;
        }
    </style>
</head>
<body>

    <div id="sidebar-container"></div>

    <div class="main-content">
        <div class="bg-white rounded shadow-sm p-4">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h1 class="h5 mb-0">Danh sách sản phẩm</h1>
                <div>
                    <button id="btnAddProduct" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addProductModal">Thêm mới</button>
                </div>
            </div>

            <div class="table-container">
                <table class="table">
                    <thead>
                        <tr>
                            <th>Tên</th>
                            <th>Danh mục</th>
                            <th>Thương hiệu</th>
                            <th>Giá</th>
                            <th>Giảm giá</th>
                            <th>Số lượng</th>
                            <th>Số lượt mua</th>
                            <th>Ảnh</th>
                            <th>Trạng thái</th>
                            <th>Miêu tả</th>
                        </tr>
                    </thead>
                    <tbody id="productTableBody">
                    </tbody>
                </table>
            </div>

            <div id="pagination" class="d-flex justify-content-center mt-3"></div>
        </div>
    </div>

    <div class="modal fade" id="addProductModal" tabindex="-1" aria-labelledby="addProductModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="addProductModalLabel">Thêm/Sửa sản phẩm</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="addProductForm">
                        <div class="mb-3">
                            <label class="form-label">Tên:</label>
                            <input type="text" id="newProductName" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Danh mục:</label>
                            <select id="newProductCategory" class="form-select" required></select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Thương hiệu:</label>
                            <select id="newProductBrand" class="form-select" required></select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Giá:</label>
                            <input type="number" id="newProductPrice" class="form-control" required min="0">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Giảm giá:</label>
                            <input type="number" id="newProductDiscount" class="form-control" required min="0" max="100">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Số lượng:</label>
                            <input type="number" id="newProductQuantity" class="form-control" required min="0">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Trạng thái:</label>
                            <select id="newProductStatus" class="form-select" required>
                                <option value="true">Hoạt động</option>
                                <option value="false">Không hoạt động</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Miêu tả:</label>
                            <textarea id="newProductDescription" class="form-control" rows="3"></textarea>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Ảnh:</label>
                            <input type="file" id="newProductImage" class="form-control" accept="image/*">
                            <img id="previewImage" src="" alt="Ảnh xem trước" class="mt-2" style="max-width: 100%; display: none;">
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
                    <button type="button" class="btn btn-danger" id="btnDeleteProduct" style="display: none;">Xóa</button>
                    <button type="button" class="btn btn-success" id="btnSaveProduct">Lưu</button>
                </div>
            </div>
        </div>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../static/js/product.js"></script>
    <script src="../static/js/sidebar.js"></script>

</body>
</html>
