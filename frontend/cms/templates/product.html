<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý sản phẩm</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../static/css/product.css">
    <link rel="stylesheet" href="../static/css/sidebar.css">
</head>
<body>

    <div id="sidebar-container"></div>

    <div class="main-content">
        <div class="bg-white rounded shadow-sm p-4">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h1 class="h5 mb-0">Danh sách sản phẩm</h1>
                <div>
                    <button id="btnAddProduct" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addProductModal">Thêm mới</button>
                    <button class="btn btn-success ms-2" id="saveChanges">Lưu</button>
                </div>
            </div>

            <div class="table-container">
                <table class="table">
                    <thead>
                        <tr>
                            <th>Tên</th>
                            <th>Danh mục</th>
                            <th>Thương hiệu</th>
                            <th>Giá</th>
                            <th>Giảm giá</th>
                            <th>Số lượng</th>
                            <th>Số lượt mua</th>
                            <th>Ngày tạo</th>
                            <th>Ảnh</th>
                            <th>Trạng thái</th>
                        </tr>
                    </thead>
                    <tbody id="productTableBody">
                        <!-- Dữ liệu sẽ được thêm từ JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Modal Thêm Sản Phẩm -->
    <div class="modal fade" id="addProductModal" tabindex="-1" aria-labelledby="addProductModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="addProductModalLabel">Thêm sản phẩm mới</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <label>Tên:</label>
                    <input type="text" id="newProductName" class="form-control">
    
                    <label>Danh mục:</label>
                    <select id="newProductCategory" class="form-select"></select>
    
                    <label>Thương hiệu:</label>
                    <select id="newProductBrand" class="form-select"></select>
    
                    <label>Giá:</label>
                    <input type="text" id="newProductPrice" class="form-control">
    
                    <label>Giảm giá:</label>
                    <input type="text" id="newProductDiscount" class="form-control">
    
                    <label>Số lượng:</label>
                    <input type="number" id="newProductQuantity" class="form-control">
    
                    <label>Số lượt mua:</label>
                    <input type="number" id="newProductSold" class="form-control">
    
                    <label>Ngày tạo:</label>
                    <input type="date" id="newProductDate" class="form-control">
    
                    <label>Ảnh sản phẩm:</label>
                    <input type="file" id="newProductImage" class="form-control">
                    <img id="previewImage" class="product-image mt-2" style="display:none; width: 100px; height: 120px; object-fit: cover; border-radius: 5px;">
    
                    <label>Trạng thái:</label>
                    <select id="newProductStatus" class="form-select">
                        <option value="Hoạt động">Hoạt động</option>
                        <option value="Không hoạt động">Không hoạt động</option>
                    </select>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
                    <button type="button" class="btn btn-success" id="btnSaveProduct">Lưu</button>
                </div>
            </div>
        </div>
    </div>

    <!-- JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../static/js/product.js"></script>
    <script src="../static/js/sidebar.js"></script>

</body>
</html>
