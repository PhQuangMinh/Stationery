<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../static/css/login.css">
</head>
<body>

    <div class="login-container">
        <h2 class="text-center">Đăng nhập</h2>
        <div class="form-group">
            <label for="username">Tên đăng nhập</label>
            <input type="text" id="username" class="form-control" placeholder="Nhập tên đăng nhập">
        </div>
        <div class="form-group">
            <label for="password">Mật khẩu</label>
            <input type="password" id="password" class="form-control" placeholder="Nhập mật khẩu">
        </div>
        <button class="btn btn-primary w-100 mt-3" onclick="login()">Đăng nhập</button>
        <p id="errorMessage" class="text-danger text-center mt-2" style="display: none;">Sai tên đăng nhập hoặc mật khẩu!</p>
    </div>

    <script src="../static/js/login.js"></script>
</body>
</html>
