<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thống kê</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../static/css/statistics.css">
    <link rel="stylesheet" href="../static/css/sidebar.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div id="sidebar-container"></div>

    <div class="main-content">
        <div class="container-fluid">
            <!-- Thống kê tổng quan -->
            <div class="statistics-cards">
                <div class="card">
                    <div class="card-body">
                        <h5 class="text-muted">Tổng đơn hàng</h5>
                        <div class="d-flex justify-content-between align-items-center">
                            <h2 id="totalOrders">0</h2>
                            <i class="bi bi-cart text-primary"></i>
                        </div>
                    </div>
                </div>
                <div class="card">
                    <div class="card-body">
                        <h5 class="text-muted">Doanh thu</h5>
                        <div class="d-flex justify-content-between align-items-center">
                            <h2 id="totalRevenue">0 VNĐ</h2>
                            <i class="bi bi-currency-dollar text-success"></i>
                        </div>
                    </div>
                </div>
                <div class="card">
                    <div class="card-body">
                        <h5 class="text-muted">Đơn hàng hôm nay</h5>
                        <div class="d-flex justify-content-between align-items-center">
                            <h2 id="todayOrders">0</h2>
                            <i class="bi bi-clock text-warning"></i>
                        </div>
                    </div>
                </div>
                <div class="card">
                    <div class="card-body">
                        <h5 class="text-muted">Tổng sản phẩm</h5>
                        <div class="d-flex justify-content-between align-items-center">
                            <h2 id="totalProducts">0</h2>
                            <i class="bi bi-box text-info"></i>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Biểu đồ -->
            <div class="row mt-4">
                <div class="col-md-8">
                    <div class="card">
                        <div class="card-body">
                            <h5 class="card-title">Doanh thu theo tháng</h5>
                            <canvas id="revenueChart"></canvas>
                        </div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card">
                        <div class="card-body">
                            <h5 class="card-title">Trạng thái đơn hàng</h5>
                            <canvas id="orderStatusChart"></canvas>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Top sản phẩm -->
            <div class="card mt-4">
                <div class="card-body">
                    <h5 class="card-title">Top sản phẩm bán chạy</h5>
                    <div class="table-responsive">
                        <table class="table">
                            <thead>
                                <tr>
                                    <th>Sản phẩm</th>
                                    <th>Số lượng đã bán</th>
                                    <th>Doanh thu</th>
                                </tr>
                            </thead>
                            <tbody id="topProductsTable">
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../static/js/statistics.js"></script>
    <script src="../static/js/sidebar.js"></script>
</body>
</html>
