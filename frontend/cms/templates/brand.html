<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý thương hiệu</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../static/css/brand.css">
    <link rel="stylesheet" href="../static/css/sidebar.css">
</head>
<body>
    <div id="sidebar-container"></div>

    <!-- Main Content -->
    <div class="main-content">
        <div class="bg-white rounded shadow-sm p-4">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h1 class="h5 mb-0">Danh sách thương hiệu</h1>
                <button id="btnAddBrand" class="btn btn-success">
                    <i class="bi bi-plus-circle"></i> Thêm mới
                </button>
            </div>
            
            <div class="table-container">
                <table class="table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Tên thương hiệu</th>
                            <th>Trạng thái</th>
                        </tr>
                    </thead>
                    <tbody id="brandTableBody">
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Thay thế phần popup bằng modal -->
    <div class="modal fade" id="brandModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalTitle">Thêm thương hiệu mới</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="brandId">
                    <div class="mb-3">
                        <label for="newBrandName" class="form-label">Tên thương hiệu</label>
                        <input type="text" id="newBrandName" class="form-control">
                    </div>
                    <div class="mb-3">
                        <label class="form-label d-block">Trạng thái</label>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="status" id="statusActive" value="false" checked>
                            <label class="form-check-label" for="statusActive">Hoạt động</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="status" id="statusInactive" value="true">
                            <label class="form-check-label" for="statusInactive">Không hoạt động</label>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Đóng</button>
                    <button type="button" class="btn btn-danger" id="btnDeleteBrand" style="display: none;">Xóa</button>
                    <button type="button" class="btn btn-primary" id="btnSaveBrand">Lưu</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../static/js/sidebar.js"></script>
    <script src="../static/js/brand.js"></script>
</body>
</html>
