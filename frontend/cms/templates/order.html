<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý đơn hàng</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../static/css/order.css">
    <link rel="stylesheet" href="../static/css/sidebar.css">
</head>
<body>

    <!-- Sidebar -->
    <div id="sidebar-container"></div>

    <div class="main-content">
        <div class="bg-white rounded shadow-sm p-4">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h1 class="h5 mb-0">Danh sách đơn hàng</h1>
            </div>

            <div class="table-container">
                <table class="table">
                    <thead>
                        <tr>
                            <th>Đơn hàng</th>
                            <th>Họ và tên</th>
                            <th>Số điện thoại</th>
                            <th>Ngày</th>
                            <th>Địa chỉ giao hàng</th>
                            <th>Giá trị đơn hàng</th>
                            <th>Hình thức thanh toán</th>
                            <th>Trạng thái đơn hàng</th>
                        </tr>
                    </thead>
                    <tbody id="orderTableBody">
                        <!-- Dữ liệu sẽ được thêm từ JavaScript -->
                    </tbody>
                </table>
                <!-- Thêm phân trang -->
                <div class="d-flex justify-content-center mt-4">
                    <nav aria-label="Page navigation">
                        <ul class="pagination" id="pagination">
                            <li class="page-item">
                                <button class="page-link" id="prevPage" aria-label="Previous">
                                    <span aria-hidden="true">&laquo;</span>
                                </button>
                            </li>
                            <!-- Các số trang sẽ được thêm vào đây bằng JavaScript -->
                            <li class="page-item">
                                <button class="page-link" id="nextPage" aria-label="Next">
                                    <span aria-hidden="true">&raquo;</span>
                                </button>
                            </li>
                        </ul>
                    </nav>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal chỉnh sửa đơn hàng -->
    <div class="modal fade" id="editOrderModal" tabindex="-1" aria-labelledby="editOrderModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Chỉnh sửa đơn hàng</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <label>Họ và tên:</label>
                    <input type="text" id="editCustomerName" class="form-control">
                    
                    <label>Số điện thoại:</label>
                    <input type="text" id="editPhone" class="form-control">
                    
                    <label>Ngày:</label>
                    <input type="date" id="editDate" class="form-control">
                    
                    <label>Địa chỉ giao hàng:</label>
                    <input type="text" id="editAddress" class="form-control">
                    
                    <label>Giá trị đơn hàng:</label>
                    <input type="text" id="editTotalPrice" class="form-control">
                    
                    <label>Hình thức thanh toán:</label>
                    <select id="editPaymentMethod" class="form-select" onchange="updateStatusOptions()">
                        <option value="COD">Thanh toán khi nhận hàng (COD)</option>
                        <option value="VNPAY">Thanh toán qua VNPay</option>
                    </select>
                    
                    <label>Trạng thái đơn hàng:</label>
                    <select id="editStatus" class="form-select">
                        <!-- Options sẽ được cập nhật động bằng JavaScript -->
                    </select>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
                    <button type="button" class="btn btn-success" id="saveOrderChanges">Lưu</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../static/js/order.js"></script>
    <script src="../static/js/sidebar.js"></script>

</body>
</html>
