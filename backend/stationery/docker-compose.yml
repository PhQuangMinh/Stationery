version: '3.8'

services:
  db:
    image: mysql:8
    container_name: mysql-container
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: stationery
    ports:
      - "3307:3306"
    networks:
      - my-network

  app:
    build: .
    container_name: app-container
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/stationery
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: 123456
    ports:
      - "8080:8080"
    depends_on:
      - db
    networks:
      - my-network

networks:
  my-network:
    driver: bridge
